  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.card-shadow{
  box-shadow:0 18px 42px rgba(0,0,0,.38), 0 0 0 1px rgba(242,193,78,.16), inset 0 1px 0 rgba(255,255,255,.14);
}

.premium-card{
  background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.03) 48%, rgba(0,0,0,.08)), linear-gradient(180deg,#123a77,#0a2350);
  border:1px solid rgba(242,193,78,.45);

}

  background:linear-gradient(180deg, rgba(255,255,255,.11), rgba(255,255,255,.02)), linear-gradient(180deg,#123a77,#0a2350);
  border:1px solid rgba(242,193,78,.42);
  box-shadow:0 10px 24px rgba(0,0,0,.30), inset 0 1px 0 rgba(255,255,255,.14);
}

.key-white{
  background:linear-gradient(180deg,#ffffff,#eef2ff);
  color:#071a3a;
  box-shadow:0 3px 0 #b9c2d8, 0 6px 14px rgba(0,0,0,.28);
  border:1px solid rgba(255,255,255,.9);
}

.key-white:not(:disabled):hover{
  filter:brightness(1.03);
}

.word-tile{
  box-shadow:0 4px 12px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.12);
}

.btn-gold{
  background:linear-gradient(180deg,#ffe58b,#f2c14e 58%,#d69f21);
  color:#241700;
  box-shadow:0 4px 0 #7d560d, 0 8px 18px rgba(0,0,0,.35);
}

.btn-gold:active{
  transform:translateY(2px);
  box-shadow:0 2px 0 #7d560d;
}

.btn-ghost{
  border:1px solid rgba(242,193,78,.55);
  background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
  box-shadow:0 6px 16px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.12);
}

.btn-hint{
  background:linear-gradient(180deg, rgba(255,229,139,.28), rgba(242,193,78,.12));
  border:1px solid rgba(242,193,78,.65);
  box-shadow:0 6px 16px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.18);
  color:var(--gold);
}

.key-btn{
  transition:transform .12s ease, background .15s ease, filter .15s ease;
}

.key-btn:not(:disabled):hover{
  transform:translateY(-2px);
  filter:brightness(1.08);
}

.key-btn:not(:disabled):active{
  transform:translateY(1px);
}

@keyframes pop{
  0%{
    transform:scale(.7);
    opacity:0
  }

  100%{
    transform:scale(1);
    opacity:1
  }
}

.pop{
  animation:pop .28s ease both;
}

@keyframes floaty{
  0%,100%{
    transform:translateY(0)
  }

  50%{
    transform:translateY(-6px)
  }
}

.floaty{
  animation:floaty 3.2s ease-in-out infinite;
}

@keyframes fall{
  0%{
    transform:translateY(-20px) rotate(0deg);
    opacity:1
  }

  100%{
    transform:translateY(420px) rotate(540deg);
    opacity:.1
  }
}

.confetti{
  position:absolute;
  top:-10px;
  animation:fall var(--dur) linear infinite;
}

@keyframes drawIn{
  from{
    stroke-dashoffset:120;
    opacity:0
  }

  to{
    stroke-dashoffset:0;
    opacity:1
  }
}

.draw{
  stroke-dasharray:120;
  animation:drawIn .45s ease both;
}

@keyframes wiggle{
  0%,100%{
    transform:rotate(0)
  }

  25%{
    transform:rotate(-2deg)
  }

  75%{
    transform:rotate(2deg)
  }
}

.wiggle{
  animation:wiggle .4s ease;
}

@keyframes pulseGold{
